<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tasteri – Zastoji</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HL315S3MY8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    <!--
      Napomena:
      Ovaj fajl je kopija `demo/index.html` radi lepog URL-a: /demo/tasteri.html
      Ako menjaš sadržaj, menjaj i `demo/index.html` (ili reci pa ću napraviti da bude jedan izvor).
    -->
    <style>
      :root{
        --bg:#f8fafc;
        --text:#0f172a;
        --muted:#64748b;
        --border:#e2e8f0;
        --card1:#ffffff;
        --card2:#f3f4f6;
        --blue1:#3b82f6;
        --blue2:#2563eb;
        --purple:#8b5cf6;
        --green1:#10b981;
        --green2:#059669;
        --amber1:#f59e0b;
        --amber2:#d97706;
        --red1:#ef4444;
        --red2:#b91c1c;
        --shadow:0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        background:var(--bg);
        color:var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      }
      a{color:inherit}
      button,input,select{ font:inherit; }
      .app-container{ max-width:1440px; margin:0 auto; padding:20px; }
      header{
        display:flex; justify-content:space-between; align-items:center; gap:12px;
        padding:14px 16px; border:1px solid rgba(255,255,255,0.5); border-radius:12px;
        box-shadow: var(--shadow);
        background: linear-gradient(145deg, var(--card1), var(--card2));
      }
      .header-left{ display:flex; align-items:center; gap:12px; min-width:0; }
      .header-logo{
        height: 54px; width:auto; object-fit:contain;
        opacity:0.92; filter: drop-shadow(0 8px 10px rgba(2,6,23,0.10));
      }
      @media (max-width: 900px){ .header-logo{ height:44px; } }
      .brand{ display:flex; flex-direction:column; gap:2px; min-width:0; }
      .brand h2{
        margin:0; font-weight:800; letter-spacing:0.2px;
        background: -webkit-linear-gradient(45deg, var(--blue1), var(--purple));
        -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      }
      .brand .subtitle{ font-size:0.85rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
      .tab-btn{
        border:1px solid var(--border); background:white; color:var(--muted);
        padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:700;
      }
      .tab-btn.active{
        background: linear-gradient(90deg, var(--blue1) 0%, var(--blue2) 100%);
        border-color:transparent; color:white;
        box-shadow: 0 10px 15px -3px rgba(59,130,246,0.25);
      }
      .header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
      .pill{
        display:inline-flex; align-items:center; gap:8px; padding:8px 12px;
        border-radius:999px; border:1px solid var(--border); background:white; color:var(--muted);
        font-size:0.9rem; max-width:100%;
      }
      .pill strong{color:var(--text)}
      .card{ background: linear-gradient(145deg, var(--card1), var(--card2)); box-shadow: var(--shadow); border-radius:12px; border:1px solid rgba(255,255,255,0.5); }
      main{padding-top:14px}
      .row{ display:flex; gap:14px; align-items:stretch; flex-wrap:wrap; }
      .panel{ padding:16px; }
      .panel h3{ margin:0 0 12px 0; font-size:1rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
      .btn{ border:none; cursor:pointer; border-radius:10px; padding:10px 12px; font-weight:800; }
      .btn.primary{background: linear-gradient(90deg, var(--blue1) 0%, var(--blue2) 100%); color:white}
      .btn.success{background: linear-gradient(90deg, var(--green1) 0%, var(--green2) 100%); color:white}
      .btn.warn{background: linear-gradient(90deg, var(--amber1) 0%, var(--amber2) 100%); color:white}
      .btn.danger{background: linear-gradient(90deg, var(--red1) 0%, var(--red2) 100%); color:white}
      .btn.secondary{background:#cbd5e1; color:#334155}
      .btn:disabled{opacity:.6; cursor:not-allowed}
      .mini-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      .mini-actions .btn{ padding:8px 10px; border-radius:999px; font-size:0.9rem; }
      .field{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
      label{font-size:.9rem; color:var(--muted); font-weight:700}
      input,select{ padding:10px 10px; border-radius:10px; border:1px solid var(--border); background:white; min-width:200px; }
      .muted{color:var(--muted)}
      .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
      .login-box{ width:min(420px, 100%); padding:18px; }
      .login-box h1{ margin:0; font-weight:900; letter-spacing:0.2px; background: -webkit-linear-gradient(45deg, var(--blue1), var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
      .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
      .kpi-cards{ display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; margin:14px 0; }
      .kpi-card{padding:14px}
      .kpi-label{font-size:0.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:800}
      .kpi-value{font-size:2rem; font-weight:900; margin-top:10px}
      .kpi-sub{font-size:.85rem; color:var(--muted)}
      table{ width:100%; border-collapse:collapse; }
      th,td{ padding:10px 12px; border-top:1px solid var(--border); text-align:left; font-size:0.95rem; }
      th{ background:#f1f5f9; color:#334155; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; }
      .badge{ display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-weight:900; font-size:0.8rem; }
      .badge.active{background:#fee2e2; color:var(--red1)}
      .badge.done{background:#dcfce7; color:#166534}
      .shift-banner{
        display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
        padding:16px; border-radius:12px;
        background: linear-gradient(145deg, #e0f2fe, #bae6fd);
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      }
      .shift-k{ color:#0369a1; font-weight:900; text-transform:uppercase; font-size:0.8rem; letter-spacing:1px; }
      .shift-v{ font-size:1.8rem; font-weight:900; color:#0c4a6e; margin-top:6px; }
      .active-panel{ display:flex; gap:12px; flex-wrap:wrap; align-items:stretch; }
      .machine-card{
        width:220px; height:160px; border-radius:12px; padding:14px;
        display:flex; flex-direction:column; justify-content:space-between; color:white;
        box-shadow: 0 20px 25px -5px rgba(239, 68, 68, 0.25), 0 10px 10px -5px rgba(239, 68, 68, 0.15);
      }
      .machine-card.zastoj{background: linear-gradient(135deg, var(--red1) 0%, var(--red2) 100%)}
      .machine-card.odziv{
        background: linear-gradient(135deg, var(--amber1) 0%, var(--amber2) 100%);
        box-shadow: 0 20px 25px -5px rgba(245, 158, 11, 0.25), 0 10px 10px -5px rgba(245, 158, 11, 0.15);
      }
      .card-header{font-weight:900; letter-spacing:2px; opacity:.9; font-size:.9rem}
      .card-id{font-weight:900; font-size:2.2rem; line-height:1}
      .card-status{font-weight:900; letter-spacing:1px}
      .card-timer{font-weight:900; font-size:1.2rem; opacity:.95}
      .bar-list{display:flex; flex-direction:column; gap:10px}
      .bar-item{display:flex; align-items:center; gap:10px}
      .bar-name{width:120px; font-weight:800; color:#334155}
      .bar-wrap{flex:1; height:12px; border-radius:999px; background:#e2e8f0; overflow:hidden}
      .bar-fill{height:100%; border-radius:999px; background: linear-gradient(90deg, var(--blue1), var(--blue2))}
      .bar-val{width:60px; text-align:right; color:var(--muted); font-weight:800; font-size:.9rem}
      .notice{ font-size:.9rem; color:var(--muted); line-height:1.4; }
      .danger-outline{ border:1px dashed rgba(239,68,68,0.45); background: rgba(254,226,226,0.35); padding:10px 12px; border-radius:12px; }
      @media (max-width: 900px){
        .kpi-cards{grid-template-columns: 1fr; }
        .two-col{grid-template-columns: 1fr;}
        header{flex-direction:column; align-items:stretch}
        .header-right{justify-content:space-between}
        input,select{min-width: 160px; width:100%}
        .machine-card{width:100%; max-width: 320px}
      }
      /* modal + toast + tour CSS are identical to index.html (kept for brevity in this copy) */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="toastRoot" class="toast-wrap" aria-live="polite"></div>
    <script>
      // Ovo je “thin wrapper” koji preusmeri na `index.html` da nema dupliranja logike.
      // URL ostaje /demo/tasteri.html u address bar-u.
      (async function () {
        try {
          const res = await fetch("./index.html", { cache: "no-store" });
          const html = await res.text();
          document.open();
          document.write(html);
          document.close();
        } catch (e) {
          document.getElementById("root").textContent = "Greška pri učitavanju stranice.";
        }
      })();
    </script>
  </body>
</html>
